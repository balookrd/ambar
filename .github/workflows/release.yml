name: Release
run-name: "${{ github.workflow }} — ${{ github.event.inputs.series != '' && github.event.inputs.series || 'auto' }}"

# Cuts a CalVer release (vYY.M.PATCH) for ambar:
# bumps Cargo.toml and Cargo.lock, commits `release: cut v...` to main,
# and prints the `git tag -s` command to run locally. Pushing that signed tag
# triggers `Tag Release`.

on:
  workflow_dispatch:
    inputs:
      series:
        description: "YY.M CalVer series (empty = current UTC month, e.g. 26.11)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: version
        name: Compute next version
        env:
          SERIES: ${{ github.event.inputs.series }}
        run: |
          set -euo pipefail

          if [[ -z "$SERIES" ]]; then
            SERIES="$(date -u +%-y.%-m)"
          fi

          if [[ ! "$SERIES" =~ ^[0-9]{2,}\.([1-9]|1[0-2])$ ]]; then
            echo "invalid CalVer series '$SERIES', expected YY.M without leading zero in month (e.g. 26.11)" >&2
            exit 1
          fi

          git fetch origin '+refs/tags/*:refs/tags/*' --force

          latest="$(git tag -l "v${SERIES}.*" --sort=-v:refname | grep -E "^v${SERIES//./\\.}\\.[0-9]+$" | head -n1 || true)"

          if [[ -n "$latest" ]]; then
            patch="${latest##*.}"
            next=$((patch + 1))
          else
            next=0
          fi

          version="${SERIES}.${next}"
          tag="v${version}"

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "tag ${tag} already exists" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Update version files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/version.py set "$VERSION"
          python3 .github/scripts/version.py check "$VERSION"

      - name: Commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "No version file changes for ${TAG}; release will use current HEAD"
          else
            git commit -m "release: cut ${TAG}"
          fi

      - name: Push
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Next steps
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat <<EOF | tee -a "$GITHUB_STEP_SUMMARY"

          Release commit prepared for \`${TAG}\`.

          Create and push a signed tag locally:

          \`\`\`bash
          git fetch origin
          git checkout main
          git pull --ff-only origin main
          git tag -s ${TAG} -m "${TAG}"
          git push origin ${TAG}
          \`\`\`

          Pushing \`${TAG}\` triggers **Tag Release**, which builds the static Linux musl binaries and publishes the GitHub release.
          EOF
