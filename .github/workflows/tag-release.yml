name: Tag Release
run-name: "${{ github.workflow }} — ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and manifests
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check CalVer tag and Cargo versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]{2,}\.([1-9]|1[0-2])\.[0-9]+$ ]]; then
            echo "invalid CalVer tag '$TAG', expected vYY.M.PATCH without leading zero in month (e.g. v26.11.0)" >&2
            exit 1
          fi
          python3 .github/scripts/version.py check "${TAG#v}"

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build release binary
        env:
          AR: zig ar
          RANLIB: zig ranlib
        run: cargo zigbuild --release --locked --target "${{ matrix.target }}"

      - name: Package artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="ambar-${version}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ambar" "dist/${name}"
          chmod +x "dist/${name}"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -f "dist/${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ambar-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-ambar-*
          merge-multiple: true
          path: dist

      - name: Verify all release assets are present
        run: |
          set -euo pipefail
          ls -la dist
          shopt -s nullglob
          aarch64=(dist/ambar-*-aarch64-unknown-linux-musl.tar.gz)
          x86_64=(dist/ambar-*-x86_64-unknown-linux-musl.tar.gz)
          if [[ "${#aarch64[@]}" -ne 1 ]]; then
            echo "expected 1 aarch64-unknown-linux-musl release asset, got ${#aarch64[@]}" >&2
            exit 1
          fi
          if [[ "${#x86_64[@]}" -ne 1 ]]; then
            echo "expected 1 x86_64-unknown-linux-musl release asset, got ${#x86_64[@]}" >&2
            exit 1
          fi

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          LC_ALL=C sha256sum -- *.tar.gz > SHA256SUMS.txt

      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: "2.13.1"
          GIT_CLIFF_SHA256: "9a1263f24e59a2f508c7b3d3283c9dea94a8bf697f96dbc18cc783cac6284546"
        run: |
          set -euo pipefail
          url="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o /tmp/git-cliff.tar.gz
          echo "${GIT_CLIFF_SHA256}  /tmp/git-cliff.tar.gz" | sha256sum -c -
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          sudo install "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/gen-release-notes.sh "$TAG" release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ambar ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          body_path: release-notes.md
          files: dist/*
