# One pod per node: the agent (reconcile loop plus the CSI Identity, Controller
# and Node services) and the two CSI sidecars.
#
# Placeholders, substituted by stand/install.sh (see stand/README.md):
#   AMBAR_IMAGE              image of the agent, default ambar-drbd:dev
#   AMBAR_IMAGE_PULL_POLICY  Never on the stand (the image is imported into
#                            containerd), IfNotPresent or Always on a cluster
# On a real cluster set both before `kubectl apply`:
#   sed -e 's|AMBAR_IMAGE_PULL_POLICY|IfNotPresent|' \
#       -e 's|AMBAR_IMAGE|registry.example.com/ambar-drbd:1.0|' \
#       deploy/daemonset.yaml | kubectl apply -f -
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ambar
  namespace: ambar-system
spec:
  selector:
    matchLabels:
      app: ambar
  # A rolling update moves to the next node only after the agent of the
  # previous one has been Ready for 10 s (see the readiness probe below).
  minReadySeconds: 10
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: ambar
    spec:
      serviceAccountName: ambar
      hostNetwork: true
      priorityClassName: system-node-critical
      # One reconcile pass runs external commands for up to 120 s and must not
      # be killed in the middle: SIGTERM lets the pass finish. `create-md` of
      # a volume larger than about 30 GiB may run longer than 150 s (the
      # formula in src/drbd/adm.rs: 120 s plus 1 s per started GiB); a rollout
      # during it kills the command. The volume is new and holds no data, and
      # the next pass reports `MetadataPresent` if the metadata was left
      # half-written [not measured].
      terminationGracePeriodSeconds: 150
      tolerations:
        - operator: Exists
      containers:
        - name: ambar
          image: AMBAR_IMAGE
          imagePullPolicy: AMBAR_IMAGE_PULL_POLICY
          # tini runs as PID 1 to reap orphaned drbdmeta/drbdsetup grandchildren
          # left behind if a command group times out, while forwarding SIGTERM
          # cleanly to `ambar agent` without touching its waitid(WNOWAIT) children.
          command: ["/usr/bin/tini", "--", "ambar", "agent"]
          # The same path as in the probe below and in the two sidecars:
          # /csi/csi.sock in their containers is this file (hostPath
          # socket-dir). It is also the default of `ambar agent`.
          args:
            - --csi-socket=/var/lib/kubelet/plugins/ambar/csi.sock
            - --volume-group=k3s-vg
          securityContext:
            privileged: true
          ports:
            - name: metrics
              containerPort: 9770
              protocol: TCP
          # Ready means the agent has finished its first reconcile listing and
          # published readiness (`GET /readyz` returns 200 OK; until then it
          # returns 503 Service Unavailable and NodeStageVolume answers
          # UNAVAILABLE).
          # There is NO liveness probe on purpose: one reconcile pass may run
          # an external command for up to 120 s, and a liveness restart would
          # cut it in the middle (see terminationGracePeriodSeconds).
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: VOLUME_GROUP
              value: "k3s-vg"
          volumeMounts:
            - {name: dev, mountPath: /dev}
            - {name: modules, mountPath: /lib/modules, readOnly: true}
            - {name: res, mountPath: /etc/drbd.d}
            - {name: run-lvm, mountPath: /run/lvm}
            # Mount exactly the volumes directory, at the same path as on the
            # host: not a parent directory, not another path. After a pod is
            # replaced, the kernel lists the backing file of a loop device
            # relative to this mount (`/<name>.img`), and `loop_holders` in
            # src/backing.rs recognises exactly that form. A wider mount would
            # show the file under another path, the agent would not see its
            # loop devices, and its deletion rules would break.
            - {name: volumes, mountPath: /var/lib/rancher/ambar/volumes}
            # Mounts made by the agent (NodeStageVolume, NodePublishVolume)
            # must be visible to kubelet and the container runtime on the host.
            # The CSI socket directory /var/lib/kubelet/plugins/ambar is part of
            # this mount; it is not mounted a second time below
            # /var/lib/kubelet. Observed on the stand with such a second mount
            # (hostPath socket-dir at that path) next to this Bidirectional
            # one: the number of mounts of plugins/ambar on a node was 2^n - 1,
            # 4095 to 32767 on four nodes, doubling with every start of the
            # agent pod; container creation took up to ~100 s and
            # `rollout status` timed out. After the second mount was removed,
            # three restarts left the counts unchanged. The mechanism is
            # [not isolated by a separate experiment].
            - name: kubelet
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
        - name: node-driver-registrar
          # registry.k8s.io/sig-storage/csi-node-driver-registrar v2.18.0
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar@sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/ambar/csi.sock
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
            - {name: registration-dir, mountPath: /registration}
        - name: csi-provisioner
          # registry.k8s.io/sig-storage/csi-provisioner v6.4.0
          image: registry.k8s.io/sig-storage/csi-provisioner@sha256:6ebe60fd8ed67a7f8a90d34402e9e706b274e53612d6fa5fbb8285728db622e2
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          args:
            - --csi-address=/csi/csi.sock
            # Every pod of the DaemonSet runs a provisioner; exactly one may be
            # active. The Lease in the namespace of the pod decides which.
            - --leader-election
            - --leader-election-namespace=$(POD_NAMESPACE)
            # The Topology feature gate is GA and on by default since v5.0;
            # --feature-gates=Topology=true is not set (v6.4.0 prints a
            # "GA feature gate" warning for it).
            - --strict-topology
            # CreateVolume waits up to 60 s for the replicas to become
            # UpToDate; the default of 10 s would cancel it.
            - --timeout=90s
            - --default-fstype=ext4
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
      volumes:
        - name: dev
          hostPath: {path: /dev}
        - name: modules
          hostPath: {path: /lib/modules}
        # Host /run/lvm is needed for LVM2 device-mapper locks and lvmetad/dm state.
        - name: run-lvm
          hostPath: {path: /run/lvm, type: DirectoryOrCreate}
        # The install step creates both directories on every node: the agent
        # does not create the volumes directory and stops if it is missing.
        - name: res
          hostPath: {path: /var/lib/rancher/ambar/res, type: Directory}
        - name: volumes
          hostPath: {path: /var/lib/rancher/ambar/volumes, type: Directory}
        - name: kubelet
          hostPath: {path: /var/lib/kubelet}
        - name: socket-dir
          hostPath: {path: /var/lib/kubelet/plugins/ambar, type: DirectoryOrCreate}
        - name: registration-dir
          hostPath: {path: /var/lib/kubelet/plugins_registry, type: Directory}
