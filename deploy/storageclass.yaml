# Parameters: replicas (number of nodes with a copy), protocol (A or C),
# csi.storage.k8s.io/fstype (ext4 only). See the design spec, "StorageClass".
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ambar-r3
provisioner: ambar.balookrd.github.io
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
reclaimPolicy: Delete
parameters:
  replicas: "3"
  protocol: "C"
  csi.storage.k8s.io/fstype: ext4
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ambar-r2
provisioner: ambar.balookrd.github.io
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
reclaimPolicy: Delete
parameters:
  replicas: "2"
  protocol: "C"
  csi.storage.k8s.io/fstype: ext4
