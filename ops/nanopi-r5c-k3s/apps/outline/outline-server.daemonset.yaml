# outline-server — server data plane.
# Variant A: DaemonSet — same edge role on every node. Delete if pinning instead.
# No PVC: stateless, config via ConfigMap, secrets via Secret (out of git).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: outline-server
  namespace: outline
spec:
  selector:
    matchLabels: { app: outline-server }
  template:
    metadata:
      labels: { app: outline-server }
    spec:
      hostNetwork: true                 # physical uplink / low-overhead ingress
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: outline-server
          image: <REGISTRY>/outline-server:<TAG>    # TODO: build arm64 image + push
          args: ["--config", "/etc/outline/config.toml"]
          securityContext:
            capabilities:
              add: [NET_ADMIN]          # SO_MARK / fwmark routing
          volumeMounts:
            - { name: config, mountPath: /etc/outline, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { memory: 384Mi }        # small profile, see nanopi104 notes
      volumes:
        - name: config
          projected:
            sources:
              - configMap: { name: outline-server-config }
              - secret:    { name: outline-server-secrets }   # PSK/keys — create out of band
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: outline-server-config
  namespace: outline
data:
  config.toml: |
    # TODO: server config (listeners, outbound, control). No secrets here —
    # PSK/keys go into the outline-server-secrets Secret and are projected together.
