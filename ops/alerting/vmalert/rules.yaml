# vmalert rules, migrated from ops/grafana/alerting/rules.yaml (Grafana unified
# alerting) on 2026-11-08. Thresholds, `for` and `keep_firing_for` are unchanged;
# the reasoning for each number is in
# docs/superpowers/specs/2026-08-07-uplink-email-alerting-design.md and in the
# comments below, which carry what used to be long `description` annotations.
#
# Grafana wrapped every query as `expr > bool X` plus a threshold above 0. In
# vmalert an alerting rule fires for every series the expression returns, so the
# `bool` is dropped and the comparison filters.
#
# No data means no alert, and a failed query means nothing is sent — the same
# behaviour Grafana had with noDataState/execErrState OK. A dead VictoriaMetrics
# is caught by DeadMansSwitch going silent, not by every rule firing at once.
#
# Annotations must not contain < > & : the Telegram receiver uses parse_mode
# HTML and Alertmanager templates do not escape. test.sh enforces this.
groups:
  - name: uplink
    interval: 1m
    rules:
      # Five minutes is above every ordinary scrape gap seen in a week (1-7
      # minutes) and below the real outages. unbound-exporter is listed because
      # its container on cloud1 once stayed down for three days unnoticed.
      # keep_firing_for: a target on a lossy path flaps; 35 notifications in
      # one night of 2026-08-09 from nuxt2 became one alert per outage.
      - alert: TargetDown
        expr: 'up{job=~"rust-ws-exporter|rust-ss-exporter|unbound-exporter"} < 1'
        for: 5m
        keep_firing_for: 15m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.instance }} ({{ $labels.job }}) stopped reporting'
          description: 'No successful scrape for five minutes: the process or the path to it is gone.'

      # Baseline is 12 healthy legs on cloud1/cloud2 and 4 on debian/ubuntu, so
      # zero is unambiguous.
      - alert: AllUplinksDown
        expr: 'sum by (instance) (outline_ws_uplink_health_effective) < 1'
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.instance }} has no healthy uplink at all'
          description: 'Every leg on this client is unhealthy, so there is no tunnel.'

      # Restricted to the uplink carrying traffic: a lossy standby leg (senko at
      # 44% on 2026-08-11) affects nobody and stays visible on the dashboard.
      # This also drops disabled uplinks, whose loss ratio freezes at its last
      # value. 5% matches the loss-failover threshold calibrated on .102/.104;
      # the 10m sustain separates this from single-sample spikes of 42%.
      # keep_firing_for 30m: nuxt2 crossed the threshold 59 times in one night.
      - alert: UplinkCarrierLossHigh
        expr: 'outline_ws_uplink_carrier_loss_ratio > 0.05 and on (instance, uplink) outline_ws_global_active_uplink_info == 1'
        for: 10m
        keep_firing_for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'active uplink {{ $labels.uplink }}/{{ $labels.transport }} on {{ $labels.instance }} is losing packets'
          description: 'Carrier loss above 5% for ten minutes on the uplink carrying traffic.'

      # Background shuffle_timer rotations are excluded so that only data-plane
      # failovers and wire exhaustions count. Same flapping shape as the loss
      # rule, hence the same 30m hold.
      - alert: UplinkFailoverStorm
        expr: 'sum by (instance) (increase(outline_ws_uplink_failovers_total{job="rust-ws-exporter",transport!~".*_shuffle_timer"}[15m])) > 20'
        keep_firing_for: 30m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.instance }} is churning through uplinks'
          description: 'More than 20 non-scheduled failovers in 15 minutes; shuffle_timer rotations are excluded.'

      # The nearest expiry on 2026-08-07 was 49 days out.
      - alert: UplinkCertExpiringSoon
        expr: '(outline_ws_uplink_cert_expiry_timestamp_seconds - time()) / 86400 < 14'
        for: 1h
        labels:
          severity: info
        annotations:
          summary: 'certificate for {{ $labels.uplink }} expires in under 14 days'
          description: 'Seen from {{ $labels.instance }}.'

      # A restart is an event, not a condition. The window is sized by delivery:
      # 1m evaluation plus 30s group_wait means the alert must outlive ~1.5m or
      # the notification never leaves; 3m is that floor plus slack. min by
      # (instance) so that the freshest start-time series decides. ~13 per week
      # on ubuntu, so the route (owner-events) drops resolved notices.
      - alert: ClientRestarted
        expr: 'min by (instance) (time() - outline_ws_start_time_seconds) < 180'
        labels:
          severity: info
        annotations:
          summary: 'outline-ws-rust restarted on {{ $labels.instance }}'
          description: 'The client process is younger than 3 minutes.'

  - name: nodes
    interval: 1m
    rules:
      # node-exporter starts scraping 30-90s into the boot, so the first sample
      # already shows a minute or two of uptime; 10m leaves slack over the 1m
      # evaluation plus 30s group_wait. All three nodes in one window group into
      # one mail (route groups by alertname), which points at shared power.
      - alert: NodeRebooted
        expr: 'min by (instance) (time() - node_boot_time_seconds{instance=~"k3s-[0-9]+"}) < 600'
        labels:
          severity: warning
        annotations:
          summary: 'k3s node {{ $labels.instance }} rebooted'
          description: 'The node kernel is younger than 10 minutes.'

  - name: backups
    interval: 5m
    rules:
      # The three nightly backups on the NAS (vmbackup 01:15, grafana-backup
      # 00:30, jellyfin-backup 01:45 UTC) push the time of their last success
      # once a day, so the series is sparse: last_over_time looks back past
      # the 5-minute staleness. 26 h = one missed night plus two hours of
      # slack for a slow run. The scripts are in ops/nas-monitoring/backup and
      # ops/nas-jellyfin-backup; docker logs <container> on the NAS shows why
      # a run failed.
      - alert: BackupStale
        expr: 'time() - max by (backup) (last_over_time(nas_backup_last_success_timestamp_seconds[8d])) > 26 * 3600'
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'NAS backup {{ $labels.backup }} has not succeeded for over 26 hours'
          description: 'The nightly run failed or did not start; docker logs on the NAS shows why.'

      # A backup that never reported in the last 8 days: the container is gone,
      # the push URL is wrong, or the series aged out of the BackupStale window.
      # One selector per backup, because absent_over_time cannot know names it
      # has never seen.
      - alert: BackupMissing
        expr: 'absent_over_time(nas_backup_last_success_timestamp_seconds{backup="vmbackup"}[8d]) or absent_over_time(nas_backup_last_success_timestamp_seconds{backup="grafana"}[8d]) or absent_over_time(nas_backup_last_success_timestamp_seconds{backup="jellyfin"}[8d])'
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'NAS backup {{ $labels.backup }} has not reported for 8 days'
          description: 'No success sample at all: check that the container runs and its PUSH_URL.'

  - name: heartbeat
    interval: 1m
    rules:
      # Always firing, by design: its notifications are the pulse cloud1 and
      # cloud2 listen for; silence is the signal. The condition goes through
      # the datasource: if VictoriaMetrics dies, the query fails, vmalert stops
      # sending, Alertmanager resolves the alert at its endsAt (about four
      # evaluation intervals, measured 2026-11-08), the pulse stops and both
      # observers mail. vector(1) would keep pulsing over a dead database.
      - alert: DeadMansSwitch
        expr: 'count(up) >= 1'
        labels:
          severity: none
        annotations:
          summary: 'pulse from vmalert in k3s, always firing on purpose'

  - name: ambar
    interval: 1m
    rules:
      - alert: AmbarAgentDown
        expr: 'up{job="ambar"} < 1'
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: 'ambar agent on {{ $labels.instance }} is down'
          description: 'No successful scrape of port 9770 for 3 minutes: agent crashed, DRBD module failed to load, or node is unreachable.'

      - alert: AmbarSplitBrain
        expr: 'ambar_volume_manual_check_needed > 0'
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'ambar split-brain on {{ $labels.node }} for volume {{ $labels.volume }}'
          description: 'Auto-adjust attempts for StandAlone connection exhausted; manual DRBD split-brain resolution is required.'

      - alert: AmbarVolumeNoQuorum
        expr: 'ambar_volume_quorum == 0'
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'ambar volume {{ $labels.volume }} lost quorum on {{ $labels.node }}'
          description: 'DRBD quorum is 0 for over 2 minutes: check lan0 interconnect and peer nodes.'

      - alert: AmbarVolumeSingleReplica
        expr: 'ambar_volume_uptodate_replicas < 2'
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'ambar volume {{ $labels.volume }} has fewer than 2 UpToDate replicas (seen from {{ $labels.node }})'
          description: 'Redundancy is lost; one more node failure will halt volume I/O.'

      - alert: AmbarVolumeStandalone
        expr: 'ambar_volume_standalone_connections > 0'
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: 'ambar volume {{ $labels.volume }} has StandAlone connection on {{ $labels.node }}'
          description: 'DRBD connection remained StandAlone for over 3 minutes without auto-reconnecting.'

      - alert: AmbarVolumeDegraded
        expr: 'ambar_volume_out_of_sync_bytes > 0'
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'ambar volume {{ $labels.volume }} out of sync with {{ $labels.peer }} on {{ $labels.node }}'
          description: 'Non-zero out_of_sync_bytes persisted for over 10 minutes: resync is stuck or peer is disconnected.'

      - alert: AmbarNodeTainted
        expr: 'ambar_node_tainted > 0'
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'k3s node {{ $labels.node }} carries ambar no-quorum taint'
          description: 'Node has ambar.balookrd.github.io/no-quorum:NoSchedule taint for over 2 minutes.'

      - alert: AmbarStorageBudgetHigh
        expr: 'ambar_node_allocated_bytes / 85899345920 > 0.80'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'ambar LVM budget on {{ $labels.node }} is above 80 percent'
          description: 'Allocated volume bytes exceeded 80 percent of the 80 GiB k3s-vg budget configured in ambar-nodes.'

  - name: netcraze
    interval: 1m
    rules:
      - alert: NetcrazeSnmpDown
        expr: 'up{job="netcraze-snmp"} < 1'
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: 'Netcraze SNMP scrape on {{ $labels.instance }} is down'
          description: 'No successful SNMP scrape of the router for 3 minutes: snmp-exporter container stopped, service snmp disabled, or router unreachable.'

      # Аналог NodeRebooted: sysUpTime в timeticks (1/100 s), окно 10 минут.
      # Маршрут owner-events отбрасывает resolved-уведомление.
      - alert: NetcrazeRebooted
        expr: 'sysUpTime{job="netcraze-snmp"} / 100 < 600'
        labels:
          severity: warning
        annotations:
          summary: 'Netcraze router {{ $labels.instance }} rebooted'
          description: 'Router sysUpTime is under 10 minutes.'

      # Проверяем только административно включённые WAN (ifAdminStatus == 1),
      # чтобы вручную отключённый резервный провайдер не создавал шум.
      - alert: NetcrazeWanDown
        expr: 'ifOperStatus{job="netcraze-snmp",ifName=~"ISP.*"} != 1 and on (instance, ifIndex) ifAdminStatus{job="netcraze-snmp"} == 1'
        for: 2m
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Netcraze WAN {{ $labels.ifName }} ({{ $labels.ifAlias }}) is down'
          description: 'Administratively enabled WAN interface has non-up operStatus for over 2 minutes.'

      # Реальная занятая память без освобождаемых buffers и page cache.
      - alert: NetcrazeMemoryHigh
        expr: '(memTotalReal{job="netcraze-snmp"} - memAvailReal{job="netcraze-snmp"} - memBuffer{job="netcraze-snmp"} - memCached{job="netcraze-snmp"}) / memTotalReal{job="netcraze-snmp"} > 0.85'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Netcraze RAM usage on {{ $labels.instance }} is above 85 percent'
          description: 'Effective memory usage excluding buffers and page cache exceeded 85 percent for 15 minutes.'

      # Исключаем UUID-алиас монтирования USB-накопителя (/tmp/mnt/<UUID>/),
      # дублирующий /tmp/mnt/OPKG/.
      - alert: NetcrazeDiskHigh
        expr: 'dskPercent{job="netcraze-snmp",dskPath!~"/tmp/mnt/[0-9a-f]{8}-[0-9a-f]{4}-.*"} > 85'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Netcraze disk {{ $labels.dskPath }} usage is above 85 percent'
          description: 'Mounted router filesystem exceeded 85 percent capacity for 15 minutes.'
