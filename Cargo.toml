[package]
name = "ambar"
version = "26.11.0"
edition = "2024"
rust-version = "1.100"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.8", features = ["derive", "env"] }
futures-util = "0.3.34"
k8s-openapi = { version = "0.29.0", features = ["v1_37"] }
kube = { version = "5.1.0", default-features = false, features = ["client", "derive", "rustls-tls", "ring", "runtime"] }
libc = "0.2.191"
prost = "0.14.6"
prost-types = "0.14.6"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-util = "0.7.20"
tonic = { version = "0.14.9", default-features = false, features = ["router", "server", "codegen"] }
tonic-prost = "0.14.9"

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = { version = "0.14.9", default-features = false, features = ["cleanup-markdown"] }

[dev-dependencies]
hyper-util = { version = "0.1.21", features = ["tokio"] }
tower = { version = "0.5.3", features = ["util"] }
# Client channel over a unix socket in the tests.
tonic = { version = "0.14.9", default-features = false, features = ["channel"] }
tempfile = "3.27.0"
# `start_paused`: tests of the retry delays of the first pass run in virtual time.
tokio = { version = "1.54.1", features = ["test-util"] }
