[package]
name = "ambar"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
k8s-openapi = { version = "0.29.0", features = ["v1_37"] }
kube = { version = "5.1.0", default-features = false, features = ["client", "derive", "rustls-tls", "ring", "runtime"] }
libc = "0.2.191"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-util = "0.7.20"

[dev-dependencies]
tempfile = "3.27.0"
